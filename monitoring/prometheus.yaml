global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: ranking
    static_configs:
      - targets: ["ranking:3000"]
  - job_name: technical
    static_configs:
      - targets: ["collector:9101"]
  - job_name: acceptance
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 5s
