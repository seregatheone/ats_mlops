[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-mlops"
version = "0.1.0"
description = "Reproducible local ML lifecycle research for resume ranking"
requires-python = ">=3.11,<3.12"

[project.scripts]
ats-mlops = "ats_mlops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
