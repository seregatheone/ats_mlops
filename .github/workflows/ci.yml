name: isolated-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 -B docker/ci/static.py
      - run: PYTHONPATH=src:. python3 -B -m unittest tests.unit.test_ci_transport
  lifecycle:
    needs: static
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build, unit and disposable synthetic lifecycle
        env:
          DOCKER_BUILDKIT: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B docker/ci/run.py --directory "$RUNNER_TEMP/ats-ci-private" --public "$RUNNER_TEMP/ats-ci-public"
      - name: Scoped fallback cleanup
        if: always()
        run: python3 -B docker/ci/run.py --cleanup --directory "$RUNNER_TEMP/ats-ci-private" --public "$RUNNER_TEMP/ats-ci-public"
      - name: Upload only the public receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ats-ci-public/ci.json
          if-no-files-found: warn
          retention-days: 14
